name: ci
on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck (POSIX sh)
        run: |
          sudo apt-get update -y && sudo apt-get install -y shellcheck
          shellcheck -s sh bin/entrypoint bin/supervise bin/mtor
          shellcheck -s bash deploy/monerotor-setup.sh
      - name: hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: docker build (smoke)
        run: docker build -t monerotor:ci .
      # A future step should run `setup` non-interactively (seeded env) and assert
      # the kill-switch drops non-tor egress. See DEVELOPMENT.md TODO.
