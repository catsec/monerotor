name: ci
on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pinned image, not apt's shellcheck: the runner's version drifts and then
      # CI flags things a local run didn't. Keep this in sync with the commands
      # in DEVELOPMENT.md so "lint what CI lints" is literally true.
      - name: shellcheck (POSIX sh)
        run: |
          docker run --rm -v "$PWD:/mnt:ro" koalaman/shellcheck:v0.10.0 \
            -s sh /mnt/bin/entrypoint /mnt/bin/supervise /mnt/bin/mtor
          docker run --rm -v "$PWD:/mnt:ro" koalaman/shellcheck:v0.10.0 \
            -s bash /mnt/deploy/monerotor-setup.sh
      - name: hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: docker build (smoke)
        run: docker build -t monerotor:ci .
      # A future step should run `setup` non-interactively (seeded env) and assert
      # the kill-switch drops non-tor egress. See DEVELOPMENT.md TODO.
